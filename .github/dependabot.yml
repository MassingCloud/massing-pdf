version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine tooling churn; the interesting updates stay separate.
      dev-tooling:
        patterns: ["@types/*", "eslint*", "typescript-eslint", "vite", "vitest", "@playwright/test"]
        update-types: ["minor", "patch"]
    ignore:
      # Peers are the host's choice, and bumping the floor here forces a breaking change on every
      # consumer. Major moves are made deliberately, not by a bot.
      - dependency-name: "pdfjs-dist"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pdf-lib"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
