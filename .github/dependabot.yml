version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine tooling churn; the interesting updates stay separate.
      dev-tooling:
        patterns: ["@types/*", "eslint*", "typescript-eslint", "vite", "vitest", "@playwright/test"]
        update-types: ["minor", "patch"]
    ignore:
      # Peers are the host's choice, and bumping the floor here forces a breaking change on every
      # consumer. Major moves are made deliberately, not by a bot.
      - dependency-name: "pdfjs-dist"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pdf-lib"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # Actions are pinned to a floating major (`@v4`), which is what GitHub documents for their
      # own: it picks up security fixes without a pull request each time. A patch-pinned tag like
      # `@4.37.3` is just as mutable — only a full SHA is immutable — so it buys no supply-chain
      # safety and produces a PR on every patch of a scanner that should simply stay current.
      - dependency-name: "*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
