name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: typecheck · lint · unit · build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is what Massing itself requires; 22 catches anything that breaks on newer runtimes.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build library
        run: npm run build

      # Cheap, and catches the one packaging mistake that only surfaces after publishing.
      - name: Verify entry points resolve
        run: npm run check:package

      # "Permissive licences only" is a constraint, not a preference: this library is embedded in
      # other people's products, so a copyleft transitive dependency would propagate to all of them.
      - name: Verify dependency licences
        run: npm run check:licences

      - name: Build demo
        run: npm run demo:build

      - name: Upload demo
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: demo
          path: dist-demo
          retention-days: 7

  e2e:
    name: browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          # Playwright registers an ESM loader that needs Node 20.6+; 22 avoids the edge entirely.
          node-version: 22
          cache: npm

      - run: npm ci

      # All three engines: canvas size limits, pointer/touch dispatch and IndexedDB semantics are
      # exactly the things that differ between them, and they are what this suite exercises.
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # The CSP project runs against the built demo, not the dev server.
      - name: Build demo for the CSP suite
        run: npm run demo:build

      # Covers what unit tests structurally cannot: rasterisation, the pointer gesture loop, the
      # compare pipeline and the IndexedDB adapters all need a browser that actually composites.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
