name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is what Massing itself requires; 22 catches anything that breaks on newer runtimes.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build library
        run: npm run build

      - name: Build demo
        run: npm run demo:build

      - name: Upload demo
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: demo
          path: dist-demo
          retention-days: 7
