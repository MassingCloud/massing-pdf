name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: typecheck · lint · unit · build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is what Massing itself requires; 22 catches anything that breaks on newer runtimes.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build library
        run: npm run build

      - name: Build demo
        run: npm run demo:build

      - name: Upload demo
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: demo
          path: dist-demo
          retention-days: 7

  e2e:
    name: browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Playwright registers an ESM loader that needs Node 20.6+; 22 avoids the edge entirely.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Covers what unit tests structurally cannot: rasterisation, the pointer gesture loop, the
      # compare pipeline and the IndexedDB adapters all need a browser that actually composites.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
