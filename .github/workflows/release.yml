name: Release

# Publishing is driven by a version tag, so what ships is always a specific commit someone tagged
# on purpose — never whatever happened to be on main when a workflow ran.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate only. Publishing also requires running against a tag."
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write   # required for npm provenance

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # A tag that disagrees with the manifest publishes a version nobody expects, and npm will not
      # let it be taken back — versions are immutable once published.
      - name: Tag must match the manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Typecheck · lint · unit tests
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verify entry points resolve
        run: node scripts/check-package.mjs

      - name: Show what would ship
        run: npm pack --dry-run

      # Publishing needs a tag either way — a version has to come from somewhere, and the guard
      # above only checks it when one is present. Dispatching from a branch is therefore always a
      # rehearsal, and says so rather than skipping silently.
      - name: Not a tag — nothing to publish
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          echo "::notice::Ran from ${GITHUB_REF}, which is not a tag, so nothing was published."
          echo "::notice::To publish, run this workflow against a version tag, or push one."

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
        # --provenance links the tarball to this workflow run and commit, so consumers can verify
        # where it was built. It needs id-token: write above.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
